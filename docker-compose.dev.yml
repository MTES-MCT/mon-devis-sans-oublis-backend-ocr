version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:
  # 1. STARTS FIRST
  nanonets-vllm:
    image: vllm/vllm-openai:latest
    container_name: nanonets-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # 0.25 * 44GB = 11GB (Needs more space as it is 3B params)
    command: >
      --model nanonets/Nanonets-OCR2-3B
      --quantization bitsandbytes
      --load-format bitsandbytes
      --max-model-len 3072
      --enforce-eager
      --mm-processor-cache-gb 0
      --gpu-memory-utilization 0.25
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Strict healthcheck to ensure it is fully loaded before next service starts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - ocr-network

  # 2. STARTS SECOND (Waits for Nanonets)
  deepseek-vllm:
    image: vllm/vllm-openai:latest
    container_name: deepseek-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # 0.2 * 44GB = 8.8GB (DeepSeek OCR is usually smaller, ~1.3B)
    command: >
      --model deepseek-ai/DeepSeek-OCR
      --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --max-model-len 3072
      --enforce-eager
      --gpu-memory-utilization 0.2
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      nanonets-vllm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ocr-network

  # 3. STARTS THIRD (Waits for DeepSeek)
  hunyuan-vllm:
    image: vllm/vllm-openai:latest
    container_name: hunyuan-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # 0.2 * 44GB = 8.8GB
    command: >
      --model tencent/HunyuanOCR
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --max-model-len 3072
      --enforce-eager
      --gpu-memory-utilization 0.2
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      deepseek-vllm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ocr-network

  # 4. API (Starts Last)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    container_name: ocr-backend-dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-marker,nanonets,deepseek-ocr,hunyuan-ocr}
      - NANONETS_ENDPOINT=http://nanonets-vllm:8000/v1
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8000/v1
      - HUNYUAN_ENDPOINT=http://hunyuan-vllm:8000/v1
      - MAX_CONCURRENT_OCR_REQUESTS=3
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8001:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    depends_on:
      nanonets-vllm:
        condition: service_healthy
      deepseek-vllm:
        condition: service_healthy
      hunyuan-vllm:
        condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]