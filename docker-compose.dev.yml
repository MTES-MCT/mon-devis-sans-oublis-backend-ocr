version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:

  hunyuan-vllm:
    build:
      context: ./kvcached
      dockerfile: Dockerfile.vllm-kvcached
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      --model tencent/HunyuanOCR
      --max-model-len 3072
      --gpu-memory-utilization 0.2
      --no-enable-prefix-caching
      --enforce-eager
      --host 0.0.0.0
      --port 8002
    shm_size: "4gb"
    networks: [ocr-network]
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s


  deepseek-vllm:
    build:
      context: ./kvcached
      dockerfile: Dockerfile.vllm-kvcached
    runtime: nvidia
    depends_on:
      hunyuan-vllm:
        condition: service_healthy
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      --model deepseek-ai/DeepSeek-OCR
      --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      --max-model-len 3072
      --gpu-memory-utilization 0.2
      --no-enable-prefix-caching
      --enforce-eager
      --host 0.0.0.0
      --port 8001
    shm_size: "4gb"
    networks: [ocr-network]
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  nanonets-vllm:
    build:
      context: ./kvcached
      dockerfile: Dockerfile.vllm-kvcached
    runtime: nvidia
    depends_on:
      deepseek-vllm:
        condition: service_healthy
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      --model nanonets/Nanonets-OCR2-3B
      --quantization bitsandbytes
      --load-format bitsandbytes
      --max-model-len 2048
      --mm-processor-cache-gb 0
      --gpu-memory-utilization 0.25
      --no-enable-prefix-caching
      --enforce-eager
      --host 0.0.0.0
      --port 8000
    shm_size: "4gb"
    networks: [ocr-network]
    restart: unless-stopped

  # 4. API (Starts Last)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-marker,nanonets,deepseek-ocr,hunyuan-ocr}
      - NANONETS_ENDPOINT=http://nanonets-vllm:8000/v1
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8000/v1
      - HUNYUAN_ENDPOINT=http://hunyuan-vllm:8000/v1
      - MAX_CONCURRENT_OCR_REQUESTS=3
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8001:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    depends_on:
      nanonets-vllm:
        condition: service_healthy
      deepseek-vllm:
        condition: service_healthy
      hunyuan-vllm:
        condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]