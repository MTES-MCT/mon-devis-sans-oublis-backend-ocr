version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    container_name: ocr-backend-dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-marker,nanonets,deepseek-ocr,hunyuan-ocr}
      - NANONETS_ENDPOINT=http://nanonets-vllm:8000/v1
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8000/v1
      - HUNYUAN_ENDPOINT=http://hunyuan-vllm:8000/v1
      - MAX_CONCURRENT_OCR_REQUESTS=3
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8001:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    depends_on:
      nanonets-vllm:
        condition: service_started
      deepseek-vllm:
        condition: service_started
      hunyuan-vllm:
        condition: service_started
    networks:
      - ocr-network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]

  nanonets-vllm:
    image: vllm/vllm-openai:latest
    container_name: nanonets-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # UTILIZATION: 0.25 * 44GB = 11GB
    command: >
      --model nanonets/Nanonets-OCR2-3B
      --quantization bitsandbytes
      --load-format bitsandbytes
      --max-model-len 2048
      --enforce-eager
      --mm-processor-cache-gb 0
      --gpu-memory-utilization 0.25
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ocr-network

  deepseek-vllm:
    image: vllm/vllm-openai:latest
    container_name: deepseek-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # UTILIZATION: 0.25 * 44GB = 11GB
    command: >
      --model deepseek-ai/DeepSeek-OCR
      --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --max-model-len 2048
      --enforce-eager
      --gpu-memory-utilization 0.25
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ocr-network

  hunyuan-vllm:
    image: vllm/vllm-openai:latest
    container_name: hunyuan-vllm-dev
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    # UTILIZATION: 0.18 * 44GB = 7.9GB
    command: >
      --model tencent/HunyuanOCR
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --max-model-len 2048
      --enforce-eager
      --gpu-memory-utilization 0.18
      --host 0.0.0.0
      --port 8000
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ocr-network