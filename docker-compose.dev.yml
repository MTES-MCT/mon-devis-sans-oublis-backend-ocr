version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:

  # GLM-OCR with SGLang + speculative decoding for maximum throughput
  glm-sglang:
    build:
      context: ./sglang
      dockerfile: Dockerfile.sglang
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      --model zai-org/GLM-OCR
      --port 8013
      --host 0.0.0.0
      --served-model-name glm-ocr
      --speculative-algorithm NEXTN
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --mem-fraction-static 0.4
    shm_size: "32gb"
    ipc: host
    networks: [ocr-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # DeepSeek-OCR with SGLang
  deepseek-sglang:
    build:
      context: ./sglang
      dockerfile: Dockerfile.sglang
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      --model deepseek-ai/DeepSeek-OCR
      --port 8012
      --host 0.0.0.0
      --served-model-name deepseek-ocr
      --mem-fraction-static 0.4
    shm_size: "32gb"
    ipc: host
    networks: [ocr-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # API (Starts Last)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-deepseek-ocr,glm-ocr}
      - DEEPSEEK_ENDPOINT=http://deepseek-sglang:8012/v1
      - GLM_OCR_ENDPOINT=http://glm-sglang:8013/v1
      - MAX_CONCURRENT_OCR_REQUESTS=5
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8001:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    depends_on:
      deepseek-sglang:
        condition: service_healthy
      glm-sglang:
        condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
