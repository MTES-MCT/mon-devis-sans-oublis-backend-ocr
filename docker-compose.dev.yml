version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:

  glm-vllm:
    build:
      context: ./kvcached
      dockerfile: Dockerfile.glm.vllm-kvcached
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      --model zai-org/GLM-OCR
      --max-model-len 8192
      --gpu-memory-utilization 0.25
      --enforce-eager
      --speculative-config.method mtp
      --speculative-config.num_speculative_tokens 1
      --limit-mm-per-prompt '{"image": 2}'
      --host 0.0.0.0
      --port 8013
    shm_size: "8gb"
    networks: [ocr-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  deepseek-vllm:
    build:
      context: ./kvcached
      dockerfile: Dockerfile.vllm-kvcached
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: "0"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      --model deepseek-ai/DeepSeek-OCR
      --logits_processors vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor
      --max-model-len 8192
      --gpu-memory-utilization 0.25
      --enforce-eager
      --no-enable-prefix-caching
      --host 0.0.0.0
      --port 8012
    shm_size: "8gb"
    networks: [ocr-network]
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  # 4. API (Starts Last)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-deepseek-ocr,glm-ocr}
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8012/v1
      - GLM_OCR_ENDPOINT=http://glm-vllm:8013/v1
      - MAX_CONCURRENT_OCR_REQUESTS=3
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8001:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    depends_on:
      deepseek-vllm:
        condition: service_healthy
      glm-vllm:
        condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]