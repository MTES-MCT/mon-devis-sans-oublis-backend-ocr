version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:
  # Main Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:prod
    container_name: ocr-backend-prod
    env_file:
      - .env
    environment:
      # API Security
      - API_KEY=${API_KEY}
      - SENTRY_DNS=${SENTRY_DNS}
      
      # Enabled Services
      # NOTE: Only marker service is enabled in production
      # To enable VLLM: uncomment services below and update this line
      - ENABLED_SERVICES=${ENABLED_SERVICES:-marker}
      
      # VLLM Endpoints (internal Docker network)
      - NANONETS_ENDPOINT=http://nanonets-vllm:8000/v1
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8000/v1
      - HUNYUAN_ENDPOINT=http://hunyuan-vllm:8000/v1
      
      # Concurrency Control
      - MAX_CONCURRENT_OCR_REQUESTS=3
      
      # Worker Settings (Production: 4 workers for better throughput)
      - WORKERS=${WORKERS:-4}
      - WORKER_CLASS=uvicorn.workers.UvicornWorker
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ACCESS_LOG=true
      - HOST=0.0.0.0
      - PORT=80
      
      # Performance Tuning
      - WORKER_CONNECTIONS=100
      - MAX_REQUESTS=500
      - MAX_REQUESTS_JITTER=50
      - TIMEOUT=600
      - GRACEFUL_TIMEOUT=60
      - KEEPALIVE=5
      
      # Storage
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
    
    ports:
      - "8000:80"
    
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    
    # Uncomment when enabling VLLM services
    # depends_on:
    #   nanonets-vllm:
    #     condition: service_healthy
    #   deepseek-vllm:
    #     condition: service_healthy
    #   hunyuan-vllm:
    #     condition: service_healthy
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    networks:
      - ocr-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

