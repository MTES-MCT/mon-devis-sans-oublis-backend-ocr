version: '3.8'

networks:
  ocr-network:
    driver: bridge

volumes:
  huggingface_cache:
    driver: local

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-backend:dev
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-api-key}
      - SENTRY_DNS=${SENTRY_DNS}
      - ENABLED_SERVICES=${ENABLED_SERVICES:-marker}
      - DEEPSEEK_ENDPOINT=http://deepseek-vllm:8012/v1
      - MAX_CONCURRENT_OCR_REQUESTS=3
      - WORKERS=1
      - LOG_LEVEL=debug
      - HOST=0.0.0.0
      - PORT=80
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8000:80"
    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface
      - ./temp:/tmp
    # depends_on:
    #   deepseek-vllm:
    #     condition: service_healthy
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "x-api-key: ${API_KEY:-dev-api-key}", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]